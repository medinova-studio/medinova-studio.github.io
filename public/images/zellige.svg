<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <pattern id="zellige" width="180" height="180" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#2455E6" stroke-width="1.5" opacity="0.14">
        <!-- 8-point star -->
        <path d="M90 18 L105 60 L147 75 L105 90 L120 132 L90 108 L60 132 L75 90 L33 75 L75 60 Z" />
        <circle cx="90" cy="90" r="12" stroke-width="1" />
        <!-- corner diamonds -->
        <path d="M0 0 L22 8 L0 16 Z" />
        <path d="M180 0 L158 8 L180 16 Z" />
        <path d="M0 180 L22 172 L0 164 Z" />
        <path d="M180 180 L158 172 L180 164 Z" />
        <!-- small accent dots -->
        <circle cx="33" cy="33" r="3" fill="#FFD749" stroke="none" opacity="0.9" />
        <circle cx="147" cy="33" r="3" fill="#FFD749" stroke="none" opacity="0.9" />
        <circle cx="33" cy="147" r="3" fill="#FFD749" stroke="none" opacity="0.9" />
        <circle cx="147" cy="147" r="3" fill="#FFD749" stroke="none" opacity="0.9" />
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#zellige)" />
</svg>
